<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>page1</title>
</head>
<body>
  <input type="text" id="deptId" />
  <input type="button" onclick="LoadData()">

  <div id="div1"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.1.0/jquery.min.js" integrity="sha512-LAwtVcZXPhBWVFQr9JK27ozsjKIZWJ6Y811gxInOV82L55pvK12upCcTye8dhlVJ5iIllnd4LO0zq9Ue80vxbQ==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
  <script>
    const LoadData = () => {
      let deptId = document.getElementById("deptId").value
      var divElement = document.getElementById('div1')
      $.ajax({
        url: `api/department/${deptId}`, success: function(result){
          // $("#div1").html(result);
          divElement.innerHTML = result.name
        }
      });
    }
  </script>
</body>
</html>
